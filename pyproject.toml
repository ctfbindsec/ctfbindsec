[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctfquant"
version = "0.0.1"
description = "Tier -1 live HTX funding-capture experiment"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    "python-telegram-bot>=21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "pyright>=1.1",
]

[project.scripts]
ctfquant = "ctfquant.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
